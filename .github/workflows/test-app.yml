name: Test Application

on:
  push:
    branches:
      - main
      - feature/tests
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install pytest and reporting tools
      run: |
        # Installs pytest, coverage tool, and the markdown reporter
        pip install pytest pytest-cov pytest-md-report cryptography numpy pillow

    - name: Set PYTHONPATH
      run: |
        echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

    - name: Run tests and Generate Summary
      run: |
        echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
        
        # This command automatically finds all files starting with 'test_' in 'tests/'
        pytest --cov=steganography_methods \
               --cov-report=xml \
               --md-report \
               --md-report-verbose=1 \
               --md-report-color=never \
               >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage report
      if: always() 
      uses: actions/upload-artifact@v6  # Fixed: changed from v6 (invalid) to v4
      with:
        name: coverage-report
        path: coverage.xml